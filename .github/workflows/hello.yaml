name: My First Workflow

on:
  push:
    branches:
      - main

jobs:
  say-hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20

      - name: Run the file
        run: node index.js