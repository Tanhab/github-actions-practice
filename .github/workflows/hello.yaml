name: My First Workflow

on:
  push:
    branches:
      - main

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run the file
        run: node index.js

  second-job:
    runs-on: ubuntu-latest
    steps:
      - name: I run in parallel
        run: echo "I am a separate job running at the same time"