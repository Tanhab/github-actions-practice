name: My First Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run the file
        run: node index.js

  second-job:
    runs-on: ubuntu-latest
    needs: say-hello
    steps:
      - name: I run after say-hello
        run: echo "say-hello finished successfully, now I run"